enable-module-update = true # set this to false if you do not want to receive updates for the module
parallel-jobs = 1

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/j-hc/revanced-magisk-module/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config

[YouTube-Morphe]
enabled = false
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[Pinterest]
enabled = false
app-name = "Pinterest"
patches-source = "SouBryan/pinterest-morphed"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
arch = "arm64-v8a"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/pinterest/pinterest-one-destination-for-a-world-of-inspiration/"
uptodown-dlurl = "https://pinterest.en.uptodown.com/android"

[Tiktok]
app-name = "Tiktok"
patches-source = "icysymmetra/tiktok-patches-for-morphe"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
arch = "arm64-v8a"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tiktok-pte-ltd/tik-tok-including-musical-ly/"
uptodown-dlurl = "https://tiktok.en.uptodown.com/android"

[ProtonVPN]
enabled = false
app-name = "ProtonVPN"
patches-source = "rushiranpise/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
version = "latest"
apkmirror-dlurl = "https://www.apkmirror.com/apk/proton-technologies-ag/protonvpn-secure-and-free-vpn/"
uptodown-dlurl = "https://protonvpn.en.uptodown.com/android"

[Pocket-Casts]
enabled = false
app-name = "PocketCasts"
patches-source = "rushiranpise/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
arch = "arm64-v8a"
version = "latest"
apkmirror-dlurl = "https://www.apkmirror.com/apk/automattic-inc/pocket-casts/"

[NokoPrint]
enabled = false
app-name = "NokoPrint"
patches-source = "jkennethcarino/adobo"
included-patches = "'Disable mobile ads' 'Block ads, trackers, and analytics' 'Deactivate Firebase Analytics' 'Deactivate Firebase Performance Monitoring' 'Spoof Advertising ID'"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
arch = "arm64-v8a"
version = "latest"
apkmirror-dlurl = "https://www.apkmirror.com/apk/nokoprint-llc/nokoprint-wifi-bluetooth-usb-printing/nokoprint-wifi-bluetooth-usb-printing"
uptodown-dlurl = "https://nokoprint.en.uptodown.com/android"
# CORRECTED: Use -Ohosts with a LOCAL FILE PATH
patcher-args = """\
-e 'Block ads, trackers, and analytics' \
-Ohosts=./hosts.txt \
-OredirectionIp=0.0.0.0 \
-OisWildcard=true \
"""
